# No secrets here — everything per-deployment lives in .env (compose
# environment). Models are added at runtime, through the LiteLLM dashboard or
# `POST /peers/<id>/llm/model/new` (compose.test.yml's `register-model` does
# the latter for the fake model) — `STORE_MODEL_IN_DB=True` (compose.yml) is
# what makes an added model survive a restart without editing this file.
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Retargets LiteLLM's own key extraction (server-side) and the dashboard JS
  # (client-side, via the login response's `auth_header_name`) to
  # `x-litellm-api-key`; with it set, LiteLLM ignores `Authorization` for keys
  # (MEASURED, docs/research/2026-09-15-llm-appliance-spikes/litellm-ui-through-mesh.md
  # Q3). It was introduced because the mesh token also lived in `Authorization`;
  # it no longer does (the mesh uses `x-httpeers-token`), but the hub's `/keys`,
  # the chat app and the e2e all send the key here, and the hub's passthrough
  # moves a Bearer key it finds in `Authorization` (the Playground's) here too.
  litellm_key_header_name: x-litellm-api-key
