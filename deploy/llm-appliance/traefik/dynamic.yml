# Traefik's file-provider dynamic config (static config is on the command
# line in compose.yml). No secrets here: the basic-auth users file and the
# door-secret middleware are generated at container start from
# $ADMIN_HTPASSWD and $HUB_DOOR_SECRET (see compose.yml's
# `traefik` entrypoint override), never stored in this directory — see README's
# "Traefik and the admin htpasswd" section for why.
#
# One router for everything: the hub's local door already does its own
# routing (`/peers/<hubPeerId>/<service>/...`, `/hub/api/*`, `/` for the admin
# UI — apps/hub/src/local-door.ts) and is the door's ONLY client (the local
# door is never published to the host), so there is nothing to split here.
http:
  routers:
    admin:
      rule: "PathPrefix(`/`)"
      entryPoints: ["web"]
      service: hub
      # Order matters: basic auth first, so only an authenticated request is
      # forwarded with the door secret. `door-secret` is defined in
      # door-secret.yml, generated at container start from $HUB_DOOR_SECRET
      # (compose.yml's traefik command) -- never written to this repo.
      middlewares: ["admin-auth", "door-secret"]
  middlewares:
    admin-auth:
      basicAuth:
        usersFile: /etc/traefik/usersfile
  services:
    hub:
      loadBalancer:
        # The client's Host goes through unchanged (Traefik's default, stated
        # here because the hub's HUB_DOOR_ALLOWED_HOSTS check depends on it).
        passHostHeader: true
        servers:
          - url: "http://hub:8787"
