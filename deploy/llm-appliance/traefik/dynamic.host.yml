# The compose.host.yml variant of dynamic.yml: swapped in because with the
# hub on `network_mode: host`, "hub" is no longer a resolvable name on the
# "appliance" bridge network. Traefik joins host networking too in that mode
# (compose.host.yml), so it reaches the hub's local door over real loopback,
# exactly like a same-host process would.
http:
  routers:
    # LiteLLM itself: NO basic auth, only its own authentication (the
    # dashboard's UI_USERNAME/UI_PASSWORD login, and a virtual key or the
    # master key on its API). The hub's passthrough never adds a credential
    # (apps/hub/src/services/llm/passthrough.ts), so nothing here is open.
    # The door secret stays: it is what lets Traefik, and only Traefik, talk
    # to the hub's door.
    #
    # EXCEPT `/llm/keys`. That route is the HUB's, not LiteLLM's: it mints a
    # key with the master key and authenticates nobody itself (on the mesh,
    # `app:llm.admin` gates it). Without basic auth anything able to reach
    # 127.0.0.1:8080 could mint keys, so it stays on the `admin` router.
    litellm:
      rule: "PathRegexp(`^/peers/[^/]+/llm(/|$)`) && !PathRegexp(`^/peers/[^/]+/llm/keys/?$`)"
      priority: 100
      entryPoints: ["web"]
      service: hub
      middlewares: ["door-secret"]
    # Everything else -- the admin UI, the admin REST API, `/llm/keys` --
    # behind basic auth.
    admin:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints: ["web"]
      service: hub
      # Order matters: basic auth first, so only an authenticated request is
      # forwarded with the door secret. `door-secret` is defined in
      # door-secret.yml, generated at container start from $HUB_DOOR_SECRET
      # (compose.yml's traefik command) -- never written to this repo.
      middlewares: ["admin-auth", "door-secret"]
  middlewares:
    admin-auth:
      basicAuth:
        usersFile: /etc/traefik/usersfile
  services:
    hub:
      loadBalancer:
        # The client's Host goes through unchanged (Traefik's default, stated
        # here because the hub's HUB_DOOR_ALLOWED_HOSTS check depends on it).
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:8787"
