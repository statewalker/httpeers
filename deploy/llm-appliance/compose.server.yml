# Server overlay: the appliance as CI deploys it on the httpeers.net host.
#
#   COMPOSE_FILE=compose.yml:compose.server.yml   (set in the server's .env)
#
# What changes against compose.yml, and nothing else:
#
# - THE HUB IS PULLED, NOT BUILT. `latest` here is only a placeholder: `server/deploy.sh` writes
#   `compose.release.yml` into each release directory, pinning the hub to the image CI pushed
#   for that commit (`ghcr.io/statewalker/httpeers-hub:sha-<commit>`), and the server's
#   `COMPOSE_FILE` lists it last. So a release always runs the image it was extracted from.
# - THE MODELS COME FROM OPENROUTER, declared in `litellm/config.server.yaml` (checked in, no
#   secret), with the key from `OPENROUTER_API_KEY` in the server's `.env`. Models added through
#   the LiteLLM dashboard still work alongside (STORE_MODEL_IN_DB).
#
# What does NOT change, on purpose: Traefik stays on 127.0.0.1:8080 of the server (the admin UI
# is reached through an SSH tunnel, never through Caddy), LiteLLM and Postgres publish nothing,
# and the hub is reached by members over the mesh (relay.httpeers.net), not over HTTP.
services:
  hub:
    build: !reset null
    image: ghcr.io/statewalker/httpeers-hub:latest

  litellm:
    volumes:
      # Same target as compose.yml's mount, so this replaces it rather than adding a second one.
      - ./litellm/config.server.yaml:/app/config.yaml:ro
    # MEASURED on the server, 2026-09-18: LiteLLM's FIRST start against an empty Postgres runs
    # every Prisma migration plus a schema-diff pass and took about 2.5 min before the readiness
    # check answered -- past compose.yml's 15 s start_period + 30 x 5 s retries, so the first CI
    # deploy failed on an "unhealthy" LiteLLM that was healthy a minute later. Failures inside
    # start_period do not count, and the container turns healthy on its first pass, so a long
    # start_period costs a normal (warm) start nothing.
    healthcheck:
      start_period: 600s
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in the server .env}
