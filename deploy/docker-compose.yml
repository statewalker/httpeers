# The deployment: a reverse proxy holding the certificates, and the relay.
#
# Neither application container binds a host port. They are reachable only
# from Caddy over this network, which is what makes the Host header Caddy
# forwards trustworthy for the static-site app later -- publishing port 3000
# "just to debug" would quietly end that.

name: httpeers

networks:
  edge:
    name: httpeers_edge

volumes:
  # Certificates and ACME account state. On a host volume so that recreating
  # the container does NOT re-issue: Let's Encrypt's rate limits are per
  # registered domain, and a redeploy loop that re-issues each time will
  # exhaust them.
  caddy_data:
  caddy_config:
  # The relay's identity. The single most important piece of state here: lose
  # it and every client's configuration, which embeds this peerId, breaks.
  #
  # DECLARED EXTERNAL ON PURPOSE. Compose neither creates nor destroys it, so
  # `docker compose down -v` -- which removes every volume it owns -- cannot
  # take the relay's identity with it. The cost is one deliberate command
  # before the first start (see deploy/README.md); that is the right trade for
  # the one piece of state here with no automatic recovery.
  relay_key:
    external: true
    name: httpeers_relay_key
  # The relay's bootstrap document -- written by the relay, served by Caddy at
  # https://relay.httpeers.net/.well-known/httpeers-relay.json. Derived state,
  # rewritten on every start and deleted before every start attempt, so unlike
  # relay_key it is NOT external: losing it costs nothing.
  bootstrap:
  # RustFS's data. Declared external for the same reason as the relay's
  # identity: `docker compose down -v` removes every volume it owns, and this
  # one holds every published site.
  rustfs_data:
    external: true
    name: httpeers_rustfs_data

services:
  caddy:
    image: ghcr.io/statewalker/httpeers-ingress:latest
    container_name: httpeers_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Gandi Personal Access Token, scoped to this zone's DNS records only.
      GANDI_BEARER_TOKEN: ${GANDI_BEARER_TOKEN:?set GANDI_BEARER_TOKEN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Read-only: Caddy serves this document and must never be able to write
      # it. The relay is the only writer.
      - bootstrap:/srv/bootstrap:ro
    networks:
      - edge
    depends_on:
      - relay
      - rustfs
      - sites

  relay:
    image: ghcr.io/statewalker/httpeers-relay:latest
    container_name: httpeers_relay
    restart: unless-stopped
    environment:
      RELAY_PORT: "9090"
      RELAY_KEY_PATH: /data/.httpeers/relay.key
      # Where the bootstrap document is written. Unset it and none is written;
      # the relay's behaviour is otherwise unchanged.
      RELAY_BOOTSTRAP_PATH: /srv/bootstrap/.well-known/httpeers-relay.json
      # What peers dial. NOT what the process binds -- see
      # apps/relay/src/addresses.ts. The relay refuses to start if this is
      # unset, because a relay advertising its container-internal address runs,
      # looks healthy, and is undialable.
      RELAY_ANNOUNCE_ADDRS: ${RELAY_ANNOUNCE_ADDRS:?set RELAY_ANNOUNCE_ADDRS in deploy/.env}
      # Optional, and consumed only when the volume holds no key yet.
      RELAY_KEY: ${RELAY_KEY:-}
    volumes:
      - relay_key:/data
      - bootstrap:/srv/bootstrap
    networks:
      - edge

  rustfs:
    # Pinned, never `latest`: this is a release candidate and its behaviour
    # may still change between builds. Bump deliberately.
    image: rustfs/rustfs:v1.0.0-rc.5
    container_name: httpeers_rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in deploy/.env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in deploy/.env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # The admin console is a second, unproxied surface. Nothing needs it here
      # and it is one more thing to secure, so it is off rather than merely
      # unreachable.
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs_data:/data
    networks:
      - edge

  sites:
    image: ghcr.io/statewalker/httpeers-sites:latest
    container_name: httpeers_sites
    restart: unless-stopped
    environment:
      SITES_PORT: "3000"
      SITES_ADAPTER: s3
      # The docker network, not s3.httpeers.net: serving must not depend on
      # the public endpoint, TLS, or Caddy being up.
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-sites}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in deploy/.env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in deploy/.env}
      SITES_CACHE_TTL_MS: ${SITES_CACHE_TTL_MS:-60000}
    depends_on:
      - rustfs
    networks:
      - edge
