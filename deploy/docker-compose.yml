# The deployment: a reverse proxy holding the certificates, and the relay.
#
# Neither application container binds a host port. They are reachable only
# from Caddy over this network, which is what makes the Host header Caddy
# forwards trustworthy for the static-site app later -- publishing port 3000
# "just to debug" would quietly end that.

name: httpeers

networks:
  edge:
    name: httpeers_edge

volumes:
  # Certificates and ACME account state. On a host volume so that recreating
  # the container does NOT re-issue: Let's Encrypt's rate limits are per
  # registered domain, and a redeploy loop that re-issues each time will
  # exhaust them.
  caddy_data:
  caddy_config:
  # The relay's identity. The single most important piece of state here: lose
  # it and every client's configuration, which embeds this peerId, breaks.
  #
  # DECLARED EXTERNAL ON PURPOSE. Compose neither creates nor destroys it, so
  # `docker compose down -v` -- which removes every volume it owns -- cannot
  # take the relay's identity with it. The cost is one deliberate command
  # before the first start (see deploy/README.md); that is the right trade for
  # the one piece of state here with no automatic recovery.
  relay_key:
    external: true
    name: httpeers_relay_key
  # The relay's bootstrap document -- written by the relay, served by Caddy at
  # https://relay.httpeers.net/.well-known/httpeers-relay.json. Derived state,
  # rewritten on every start and deleted before every start attempt, so unlike
  # relay_key it is NOT external: losing it costs nothing.
  bootstrap:
  # RustFS's data. Declared external for the same reason as the relay's
  # identity: `docker compose down -v` removes every volume it owns, and this
  # one holds every published site.
  rustfs_data:
    external: true
    name: httpeers_rustfs_data

services:
  caddy:
    image: ghcr.io/statewalker/httpeers-ingress:latest
    container_name: httpeers_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Gandi Personal Access Token, scoped to this zone's DNS records only.
      GANDI_BEARER_TOKEN: ${GANDI_BEARER_TOKEN:?set GANDI_BEARER_TOKEN in deploy/.env}
      # The same, scoped to cellb.dev: the *.cellb.dev wildcard certificate.
      GANDI_CELLB_BEARER_TOKEN: ${GANDI_CELLB_BEARER_TOKEN:?set GANDI_CELLB_BEARER_TOKEN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Read-only: Caddy serves this document and must never be able to write
      # it. The relay is the only writer.
      - bootstrap:/srv/bootstrap:ro
    networks:
      - edge
    depends_on:
      - relay
      - rustfs
      - sites

  relay:
    # Pinned per commit by bin/deploy.sh (images.env); :latest until the first such deploy.
    image: ${RELAY_IMAGE:-ghcr.io/statewalker/httpeers-relay:latest}
    container_name: httpeers_relay
    restart: unless-stopped
    environment:
      RELAY_PORT: "9090"
      RELAY_KEY_PATH: /data/.httpeers/relay.key
      # Where the bootstrap document is written. Unset it and none is written;
      # the relay's behaviour is otherwise unchanged.
      RELAY_BOOTSTRAP_PATH: /srv/bootstrap/.well-known/httpeers-relay.json
      # What peers dial. NOT what the process binds -- see
      # apps/relay/src/addresses.ts. The relay refuses to start if this is
      # unset, because a relay advertising its container-internal address runs,
      # looks healthy, and is undialable.
      RELAY_ANNOUNCE_ADDRS: ${RELAY_ANNOUNCE_ADDRS:?set RELAY_ANNOUNCE_ADDRS in deploy/.env}
      # Optional, and consumed only when the volume holds no key yet.
      RELAY_KEY: ${RELAY_KEY:-}
    volumes:
      - relay_key:/data
      - bootstrap:/srv/bootstrap
    networks:
      - edge

  rustfs:
    # Pinned, never `latest`: this is a release candidate and its behaviour
    # may still change between builds. Bump deliberately.
    image: rustfs/rustfs:v1.0.0-rc.5
    container_name: httpeers_rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in deploy/.env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in deploy/.env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # The admin console is a second, unproxied surface. Nothing needs it here
      # and it is one more thing to secure, so it is off rather than merely
      # unreachable.
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs_data:/data
    networks:
      - edge

  sites:
    # Pinned per commit by bin/deploy.sh (images.env); :latest until the first such deploy.
    image: ${SITES_IMAGE:-ghcr.io/statewalker/httpeers-sites:latest}
    container_name: httpeers_sites
    restart: unless-stopped
    environment:
      SITES_PORT: "3000"
      SITES_ADAPTER: s3
      # The docker network, not s3.httpeers.net: serving must not depend on
      # the public endpoint, TLS, or Caddy being up.
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-sites}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in deploy/.env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in deploy/.env}
      SITES_CACHE_TTL_MS: ${SITES_CACHE_TTL_MS:-60000}
    depends_on:
      - rustfs
    networks:
      - edge

  stun:
    # STUN only, for stun:stun.httpeers.net:3478 (the `*` A record resolves it;
    # no DNS change). A WebRTC peer asks it "what address do you see me as?"
    # and offers the answer as its server-reflexive (srflx) candidate. That is
    # all it does: no TURN, no relaying, no credentials -- so there is nothing
    # here to abuse as a bandwidth relay and nothing to secure.
    #
    # Pinned to a release AND its digest, never `latest`. Bump deliberately.
    image: coturn/coturn:4.18.0-alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e
    container_name: httpeers_stun
    restart: unless-stopped
    # THE SECOND SERVICE WITH PUBLISHED PORTS, and the exception to this
    # file's rule: Caddy cannot proxy UDP, and a STUN answer is only useful
    # if it comes from the address the client sent to. Open 3478/udp and
    # 3478/tcp in the host firewall (deploy/README.md) -- though Docker's
    # iptables rules bypass ufw, so these are open once the container runs.
    #
    # IPv4 ONLY, explicitly. Docker publishes IPv6 only with IPv6 enabled in
    # the daemon and the network, which this host does not have; so there must
    # be no AAAA record for stun.httpeers.net until it does (deploy/README.md).
    ports:
      - "0.0.0.0:3478:3478/udp"
      - "0.0.0.0:3478:3478/tcp"
    # Replaces the image's default command, which shells out to
    # `detect-external-ip` -- an outbound lookup at every start that only a
    # TURN relay needs (it advertises relay addresses; STUN reports the
    # client's, never its own).
    command:
      - --stun-only # TURN requests (Allocate, ...) are ignored, not answered
      - --no-auth # no realm, no users: a Binding request needs none
      # Belt and braces: with --stun-only no relay exists, and if that flag
      # were ever dropped, every peer address is still denied. (Not
      # --no-udp-relay plus --no-tcp-relay: coturn refuses to start with both.)
      - --denied-peer-ip=0.0.0.0-255.255.255.255
      - --denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      # TLS (5349) needs a certificate; not for now. DTLS, and the telnet admin
      # console (5766), are off unless `--dtls` / `--cli` is given: no flag.
      - --no-tls
      - --fingerprint
      - --listening-port=3478
      - --log-file=stdout
      - --simple-log
      # One process, a handful of threads: a Binding answer is one packet.
      - --relay-threads=1
    # The image's own client, against the server's own listener. A Binding
    # request answered is the only thing "healthy" can mean for this service.
    # UDP only: turnutils_stunclient has no TCP mode, and the image has no
    # other STUN client. TCP shares the listener and the process, so a TCP-only
    # failure is unlikely; the external check (deploy/README.md) covers both.
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-t", "2000", "127.0.0.1"]
      interval: 60s
      timeout: 10s
      retries: 3
    # No `networks:` on purpose: nothing talks to it over `edge`, and it talks
    # to nothing. It gets the project's default network, used for the port
    # mapping alone.
