<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>httpeers · hub admin</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; margin: 0 auto; max-width: 48rem; padding: 1.5rem 1rem 4rem; }
  h1 { font-size: 1.4rem; margin-bottom: .2rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; }
  code, .mono { font-family: ui-monospace, monospace; font-size: .85em; word-break: break-all; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem .8rem; margin: .5rem 0; }
  dt { color: #52525b; }
  label { display: block; margin: .4rem 0; }
  input[type="text"] { font: inherit; width: 100%; box-sizing: border-box; }
  button { font: inherit; padding: .4rem .8rem; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
  caption { text-align: left; font-weight: 600; margin-bottom: .3rem; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #e4e4e7; }
  .muted { color: #52525b; }
  .err { background: #fee2e2; padding: .8rem 1rem; border-radius: 6px; white-space: pre-wrap; }
  #qr svg { width: 180px; height: 180px; }
</style>

<h1>Hub</h1>

<dl>
  <dt>mesh id</dt><dd class="mono" id="mesh-id">…</dd>
  <dt>relay</dt><dd class="mono" id="relay">…</dd>
  <dt>services</dt><dd class="mono" id="services">…</dd>
  <!-- Whether the RELAY still holds this hub's reservation. A hub whose door
       answers but whose reservation is gone is unreachable to every member,
       and used to look entirely healthy from here. -->
  <dt>reservation</dt><dd id="reservation">…</dd>
</dl>

<!-- The real href (`/peers/<hubPeerId>/llm/ui/login/`) is set by main.ts before this row is shown. -->
<p id="dashboard-row" hidden><a id="dashboard-link" href="about:blank">LiteLLM dashboard</a></p>

<div id="error" class="err" hidden></div>

<h2>Invite someone</h2>
<p>
  <label>Roles <select id="roles"></select></label>
  <button type="button" id="mint" disabled>Mint invitation</button>
</p>
<div id="invitation" hidden>
  <label>Link <input id="link" type="text" readonly /></label>
  <p class="muted" id="expires"></p>
  <div id="qr"></div>
</div>

<h2>Members</h2>
<table>
  <caption>Members</caption>
  <thead><tr><th>peer</th><th>roles</th><th>presence</th><th>connection</th><th></th></tr></thead>
  <tbody id="members"><tr><td colspan="5" class="muted">loading…</td></tr></tbody>
</table>
<p class="muted" id="admin-status" role="status"></p>

<script type="module" src="./main.ts"></script>
