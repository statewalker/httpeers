name: ingress

# The Caddy image, built with the Gandi DNS module because stock Caddy cannot
# do DNS-01 and DNS-01 is the only challenge that issues a wildcard.
#
# Deploying this restarts the thing that terminates TLS for everything, so it
# is deliberately NOT automatic on push. Run it, then deploy by hand.

on:
  push:
    branches: [main]
    paths:
      - "deploy/ingress/**"
      - ".github/workflows/ingress.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/httpeers-ingress

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: deploy/ingress
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
