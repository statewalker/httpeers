name: sites

on:
  push:
    branches: [main]
    paths:
      - "apps/sites/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/sites.yml"
  workflow_dispatch:

concurrency:
  group: sites-deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/httpeers-sites

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sites/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull sites
            docker compose up -d sites

            # Unlike the relay there is no identity to assert, so the check is
            # that it actually answers: a container that starts with broken
            # storage configuration would otherwise look like a clean deploy.
            for _ in $(seq 1 30); do
              CODE=$(docker compose exec -T sites node -e '
                fetch("http://127.0.0.1:3000/", { headers: { Host: "healthcheck.invalid" } })
                  .then((r) => { console.log(r.status); process.exit(0); })
                  .catch(() => process.exit(1));
              ' 2>/dev/null || true)
              [ -n "$CODE" ] && break
              sleep 2
            done
            if [ -z "${CODE:-}" ]; then
              echo "DEPLOY FAILED: sites did not answer within 60s."
              docker compose logs --tail=40 sites
              exit 1
            fi
            echo "sites answering; unknown host -> HTTP $CODE (404 expected)"
