name: sites

on:
  push:
    branches: [main]
    paths:
      - "apps/sites/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/sites.yml"
  # Pull requests build the image without pushing it: a Dockerfile that no longer builds shows
  # on the PR, not after the merge.
  pull_request:
    paths:
      - "apps/sites/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/sites.yml"
  workflow_dispatch:

concurrency:
  group: sites-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/httpeers-sites

jobs:
  # The shared CI (statewalker/.github): an image is only built for deployment from a commit
  # that passes it. Pull requests run CI in ci.yml already, so here it runs for main only.
  ci:
    if: github.event_name != 'pull_request'
    uses: statewalker/.github/.github/workflows/ci.yml@main

  publish:
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sites/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    steps:
      # The forced-command key (deploy/server/README.md): it can only run bin/deploy.sh, which
      # runs this commit's image, verifies it and rolls back on failure. Chosen with
      #   gh variable set EDGE_DEPLOY_FORCED --body true
      # once the server side is installed; until then the step below deploys as before.
      - name: Deploy this commit on the server
        if: vars.EDGE_DEPLOY_FORCED == 'true'
        env:
          SSH_KEY: ${{ secrets.EDGE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          TARGET_HOST: ${{ secrets.DEPLOY_HOST }}
          TARGET_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/edge_deploy
          chmod 600 ~/.ssh/edge_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server runs deploy.sh whatever is sent; this line only names the service and sha.
          ssh -i ~/.ssh/edge_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$TARGET_USER@$TARGET_HOST" "deploy sites $GITHUB_SHA"

      - name: Pull and restart on the server
        if: vars.EDGE_DEPLOY_FORCED != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull sites
            docker compose up -d sites

            # Unlike the relay there is no identity to assert, so the check is
            # that it actually answers: a container that starts with broken
            # storage configuration would otherwise look like a clean deploy.
            for _ in $(seq 1 30); do
              CODE=$(docker compose exec -T sites node -e '
                fetch("http://127.0.0.1:3000/", { headers: { Host: "healthcheck.invalid" } })
                  .then((r) => { console.log(r.status); process.exit(0); })
                  .catch(() => process.exit(1));
              ' 2>/dev/null || true)
              [ -n "$CODE" ] && break
              sleep 2
            done
            if [ -z "${CODE:-}" ]; then
              echo "DEPLOY FAILED: sites did not answer within 60s."
              docker compose logs --tail=40 sites
              exit 1
            fi
            echo "sites answering; unknown host -> HTTP $CODE (404 expected)"
