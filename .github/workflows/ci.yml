name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint:check

      - run: pnpm run typecheck

      # These bind real ports and start real libp2p nodes, hence
      # --no-file-parallelism inside the package's own test script.
      - run: pnpm run test
