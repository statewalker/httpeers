name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: statewalker/.github/.github/workflows/ci.yml@main

  # Releases to npm: a version pull request while changes are unreleased, publishing once it is
  # merged. npm's trusted publishers for these packages name this file (ci.yml).
  #
  # The job used to be statewalker/.github's release.yml, removed there in 7bb09c8; it is kept
  # here as it was. The release plan still comes from that repository's
  # scripts/release-changesets.mjs: a patch for every package whose packed files or published
  # manifest differ from npm's `latest`, a minor (0.x) / major when a dependency moved to another
  # breaking line. Packages not on npm yet are published as they are.
  #
  # npm authentication: trusted publishing (OIDC) when the package has a trusted publisher for
  # this file on npmjs.com, otherwise the NPM_TOKEN secret. A package's first version needs
  # NPM_TOKEN: a trusted publisher can only be added to a package that exists.
  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release scripts
        uses: actions/checkout@v7
        with:
          repository: statewalker/.github
          ref: main
          path: .statewalker-ci

      - name: Move the release scripts out of the workspace
        run: mv .statewalker-ci "$RUNNER_TEMP/statewalker-ci"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm
        run: npm install --global npm@^11.6.0 && npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run --if-present build

      - name: Changesets for unreleased changes
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/release-changesets.mjs"

      - name: Version pull request or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm exec changeset version
          publish-script: pnpm exec changeset publish
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
