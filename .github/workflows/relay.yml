name: relay

# Publishes the relay image, then deploys it.
#
# Deploy is a SEPARATE JOB rather than a step, so that a publish which
# succeeds and a deploy which fails are distinguishable in the run list --
# they have very different remedies.

on:
  push:
    branches: [main]
    paths:
      - "apps/relay/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

concurrency:
  # A queued deploy of a superseded image is worse than no deploy: it would
  # roll the server backwards.
  group: relay-deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/httpeers-relay

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          # The repository root: pnpm needs the workspace manifests.
          context: .
          file: apps/relay/Dockerfile
          # amd64 only. The target is a known x86-64 host; adding arm64 roughly
          # doubles build time under QEMU for a platform nothing runs on.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    # Off until the server exists. Without this the deploy fails on every push
    # for want of secrets, main sits permanently red, and a red main that
    # everyone knows to ignore is worse than no signal at all -- it is the
    # state in which a REAL failure goes unnoticed.
    #
    # Turn it on with:
    #   gh variable set DEPLOY_ENABLED --body true
    # once DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH are set.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            # Read BEFORE the pull. `up -d` may replace the container, and the
            # old container's logs go with it, so this cannot be recovered
            # afterwards. --tail, not --since: when the image is already
            # current the container is NOT recreated, so a time window finds
            # nothing and reports a false failure.
            peerid_now() { docker compose logs --tail=200 relay 2>&1 | grep -oE '12D3[A-Za-z0-9]{40,}' | tail -1 || true; }

            BEFORE=$(peerid_now)
            docker compose pull relay
            docker compose up -d relay

            AFTER=""
            for _ in $(seq 1 30); do
              AFTER=$(peerid_now)
              [ -n "$AFTER" ] && break
              sleep 2
            done
            LOG=$(docker compose logs --tail=200 relay 2>&1 || true)

            if [ -z "$AFTER" ]; then
              echo "DEPLOY FAILED: the relay reported no peerId within 60s."
              printf '%s\n' "$LOG" | tail -30
              exit 1
            fi

            # The peerId is embedded in every multiaddr clients dial. If it
            # changes, every client's configuration is invalid at once -- so
            # this fails the deploy rather than printing a line nobody reads.
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$AFTER" ]; then
              echo "DEPLOY FAILED: the relay's peerId CHANGED."
              echo "  before: $BEFORE"
              echo "  after : $AFTER"
              echo "The relay_key volume was most likely lost or recreated."
              echo "Restore it from the backup before anyone caches the new identity."
              exit 1
            fi

            # The other silent failure: a relay advertising a container-internal
            # address starts, reports healthy, and is undialable by everyone.
            if ! printf '%s' "$LOG" | grep -q '/dns4/'; then
              echo "DEPLOY FAILED: the relay advertises no /dns4/ address."
              printf '%s\n' "$LOG" | tail -20
              exit 1
            fi
            if printf '%s' "$LOG" | grep -qE '0\.0\.0\.0|/ip4/172\.'; then
              echo "DEPLOY FAILED: the relay is advertising a container-internal address:"
              printf '%s\n' "$LOG" | grep -E '0\.0\.0\.0|/ip4/172\.'
              exit 1
            fi

            echo "peerId unchanged: $AFTER"
            printf '%s\n' "$LOG" | grep -oE '/dns4/[^ ]+' | sed 's/^/advertising: /'
