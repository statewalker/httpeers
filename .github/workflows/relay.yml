name: relay

# Publishes the relay image, then deploys it.
#
# Deploy is a SEPARATE JOB rather than a step, so that a publish which
# succeeds and a deploy which fails are distinguishable in the run list --
# they have very different remedies.

on:
  push:
    branches: [main]
    paths:
      - "apps/relay/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

concurrency:
  # A queued deploy of a superseded image is worse than no deploy: it would
  # roll the server backwards.
  group: relay-deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/httpeers-relay

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          # The repository root: pnpm needs the workspace manifests.
          context: .
          file: apps/relay/Dockerfile
          # amd64 only. The target is a known x86-64 host; adding arm64 roughly
          # doubles build time under QEMU for a platform nothing runs on.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    # Off until the server exists. Without this the deploy fails on every push
    # for want of secrets, main sits permanently red, and a red main that
    # everyone knows to ignore is worse than no signal at all -- it is the
    # state in which a REAL failure goes unnoticed.
    #
    # Turn it on with:
    #   gh variable set DEPLOY_ENABLED --body true
    # once DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH are set.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull relay
            docker compose up -d relay
            # The peerId must be unchanged across a deploy -- it is embedded in
            # every client's configuration. Surface it so a regression is
            # visible in the run log rather than in user reports.
            sleep 5
            docker compose logs --tail=50 relay | grep -i "peerId" || true
