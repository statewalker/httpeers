# A FLOOR for node-datachannel, the native WebRTC engine under `@libp2p/webrtc`
# in Node. 0.33.6 is the first release that bundles libdatachannel 0.24.6, which
# carries the upstream fix for a DTLS startup race on the offerer (libdatachannel
# 0235225, "start DTLS after remote description"): with 0.24.5 and older, a Node
# member's WebRTC dial failed often under CPU load (`DTLS alert: unknown CA`).
# httpeers dials WebRTC once and relies on this; `@libp2p/webrtc`'s own range
# (^0.33.4) would still accept a release without the fix.
# `httpeers-libp2p/tests/libdatachannel-version.test.ts` checks the loaded library.
overrides:
  node-datachannel: ^0.33.6

onlyBuiltDependencies:
  - esbuild
  # A SAFEGUARD, a no-op today. `@libp2p/webrtc` depends on `node-datachannel`,
  # a native module. Earlier releases fetched the prebuilt `.node` binary from
  # an `install` script, which pnpm 10 blocks SILENTLY unless the package is
  # named here: the workspace looked healthy and `@statewalker/httpeers-member/node`
  # threw `Cannot find module '.../node_datachannel.node'` on first import
  # (caught by `httpeers-conformance/tests/runtime-import.test.ts`). Current
  # releases (0.33.x) have no install script: the binary ships in an optional
  # per-platform package, `@node-datachannel/<platform>` (e.g. `linux-x64-gnu`),
  # which pnpm installs for the running platform only. So what breaks the import
  # now is that package missing: optional dependencies turned off, or a
  # node_modules installed on another platform. Kept in case a release brings an
  # install step back.
  - node-datachannel

# A version is installable 3 days (in minutes) after it is published: a compromised release is
# usually caught and removed within that time. Our own packages are exempt, so a release in one
# statewalker repository can be taken in the next one at once. pnpm 10.16 matches exact names
# only (an `@statewalker/*` pattern is ignored): a new `@statewalker/` dependency is added here.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@statewalker/shared-slots"
  - "@statewalker/webrun-files"
  - "@statewalker/webrun-files-mem"
  - "@statewalker/webrun-files-node"
  - "@statewalker/webrun-files-s3"
  - "@statewalker/webrun-http-browser"
  - "@statewalker/webrun-http-proxy"
  - "@statewalker/webrun-http-streams"
  - "@statewalker/webrun-msgpack"
  - "@statewalker/webrun-rpc"
  - "@statewalker/webrun-streams"
  - "@statewalker/webrun-streams-libp2p"


